<header class="masthead" id="top">

    </a>

      <svg class="ic"><use href="#i-search"/></svg>

<div class="modal" id="loginModal" hidden>

    <img src="assets/logo.webp" alt="" width="72" height="72">
    <h2 data-i18n="login">כניסה ללקוחות</h2>
    <p data-i18n="loginText">הזינו שם משתמש וסיסמה כדי לראות מחירים.</p>
    <label for="lgUser" data-i18n="username">שם משתמש</label>
    <input id="lgUser" autocomplete="username" required dir="ltr">
    <label for="lgPass" data-i18n="password">סיסמה</label>
    <input id="lgPass" type="password" autocomplete="current-password" required dir="ltr">
    <p class="form-msg" id="lgMsg" role="status"></p>
    <button class="btn btn-gold btn-block" type="submit" data-i18n="enter">כניסה</button>
  </form>
</div>

  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="drawer-head">
      <h2 id="cartTitle"><svg class="ic"><use href="#i-cart"/></svg><span data-i18n="cartTitle">סל ההזמנה</span></h2>
      <button type="button" class="modal-x" data-cart-close aria-label="סגירה" data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <form class="drawer-foot" id="cartForm" novalidate>
      <h3 data-i18n="bizDetails">פרטי העסק</h3>
      <div class="fields">
        <div><label for="cBiz" data-i18n="bizName">שם העסק *</label><input id="cBiz" autocomplete="organization" required></div>
        <div><label for="cPhone" data-i18n="bizPhone">טלפון *</label><input id="cPhone" type="tel" dir="ltr" autocomplete="tel" required></div>
        <div><label for="cName" data-i18n="contact">איש קשר</label><input id="cName" autocomplete="name"></div>
        <div class="wide"><label for="cNote" data-i18n="notes">הערות להזמנה</label><textarea id="cNote" rows="2"></textarea></div>
      </div>
      <p class="form-msg" id="cartMsg" role="status"></p>
      <p class="cart-sub" data-i18n="sendWa">שליחת ההזמנה בוואטסאפ</p>
      <div class="cart-btns">
        <button type="submit" class="btn btn-wa btn-lg"><svg class="ic"><use href="#i-wa"/></svg><span data-i18n="waTo1">אלאפנדי</span></button>
        <button type="button" class="btn btn-wa btn-lg" id="cartWa2"><svg class="ic"><use href="#i-wa"/></svg><span id="cartWa2Name">ניזאר</span></button>
      </div>
      <p class="cart-sub" data-i18n="pdf">הזמנה כקובץ PDF</p>
      <div class="cart-btns">
        <button type="button" class="btn btn-line" id="cartPdfDl"><svg class="ic"><use href="#i-dl"/></svg><span data-i18n="pdfDl">הורדה</span></button>
        <button type="button" class="btn btn-line" id="cartPdfShare"><svg class="ic"><use href="#i-share"/></svg><span data-i18n="pdfShare">שיתוף</span></button>
      </div>
      <button type="button" class="link-clear" id="cartClear" data-i18n="clearCart">ריקון הסל</button>
    </form>
  </div>
</div>
