# Builds an installable Android APK for free on GitHub.
# Run it from the repository's "Actions" tab ("Run workflow"), then download the APK from the run's Artifacts.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: elafandy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as the latest release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk elafandy.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest elafandy.apk --title "Elafandy app" --notes "Build ${{ github.run_number }}" --latest
