# Builds an installable Android APK for free on GitHub.
# Run it from the repository's "Actions" tab ("Run workflow"), then download the APK from the run's Artifacts.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # Ship the website's current products and prices inside the APK (the app still refreshes them
      # from the website on every launch). Keeps the built-in copy if the website can't be reached.
      - name: Take the latest products and prices from the website
        run: |
          if curl -fsSL --retry 3 https://www.elafandy-tech.com/data/products.js -o /tmp/products.js && grep -q '^window.CATALOG=' /tmp/products.js; then
            cp /tmp/products.js catalog/data/products.js
            echo "::notice::Products from the website: $(grep -o '"priceDate":"[^"]*"' catalog/data/products.js | head -1)"
          else
            echo "::warning::Could not download the website's products; using the copy in the repository"
          fi
      - run: npm run sync
      # Signed release APK when the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets are set (same key every build,
      # so new versions install over old ones); otherwise a debug APK as before.
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
            # tolerate copy-paste slips: spaces/newlines, or the whole "KEYSTORE_PASSWORD=..." line
            KEYSTORE_PASSWORD=$(printf %s "$KEYSTORE_PASSWORD" | tr -d '[:space:]'); KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD#KEYSTORE_PASSWORD=}
            export KEYSTORE_PASSWORD
            printf %s "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -di > "$RUNNER_TEMP/release.p12" \
              || { echo "::error::KEYSTORE_BASE64 is not valid - paste the whole KEYSTORE_BASE64.txt again"; exit 1; }
            ks_ok() { keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype pkcs12 -storepass "$1" >/dev/null 2>&1; }
            # phone keyboards capitalise the first letter when pasting into an empty box
            if ! ks_ok "$KEYSTORE_PASSWORD"; then
              alt="$(printf %s "${KEYSTORE_PASSWORD:0:1}" | tr '[:upper:]' '[:lower:]')${KEYSTORE_PASSWORD:1}"
              ks_ok "$alt" && export KEYSTORE_PASSWORD="$alt"
            fi
            ks_ok "$KEYSTORE_PASSWORD" \
              || { echo "::error::Keystore and KEYSTORE_PASSWORD do not match ($(stat -c%s "$RUNNER_TEMP/release.p12") bytes decoded)"; exit 1; }
            export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            ./gradlew assembleRelease -PversionCode=${{ github.run_number }} > build.log 2>&1 \
              || { grep -iE "what went wrong|error|exception" -A3 build.log | head -15 | sed 's/^/::error::/'; tail -40 build.log; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk ../elafandy.apk
          else
            ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk ../elafandy.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: elafandy-apk
          path: elafandy.apk
      - name: Publish APK as the latest release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest elafandy.apk --title "Elafandy app" --notes "Build ${{ github.run_number }}" --latest
