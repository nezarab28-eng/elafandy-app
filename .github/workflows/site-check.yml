# Manual check of what the website serves to the app (run from the Actions tab).
# Saves a copy of the website's code and data files (no images) to the "site-snapshot" branch.
name: Website check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the website's files and check its images
        run: |
          mkdir snap && cd snap
          B=https://www.elafandy-tech.com
          for path in index.html assets/app.js assets/style.css assets/config.js data/products.js sw.js manifest.webmanifest; do
            mkdir -p "$(dirname "$path")"; curl -sf "$B/$path" -o "$path" || echo "missing $path" >> report.txt
          done
          grep -oE '(src|href)="[^"]+"' index.html | sort -u >> report.txt
          ids=$(grep -o '"id":"[^"]*"' data/products.js | cut -d'"' -f4)
          echo "products: $(echo "$ids" | wc -l)" >> report.txt
          for id in $ids; do
            for ext in webp jpg png; do
              r=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$B/images/$id.$ext")
              [ "${r%% *}" = 200 ] && { echo "$id.$ext $r $(curl -sI "$B/images/$id.$ext" | grep -i '^last-modified' | tr -d '\r')" >> images.txt; break; }
            done
          done
          echo "images found: $(wc -l < images.txt)" >> report.txt
          id1=$(echo "$ids" | head -1)
          echo "image with app referer: $(curl -s -o /dev/null -w '%{http_code}' -H 'Referer: https://localhost/' "$B/images/$id1.webp")" >> report.txt
          echo "image headers:" >> report.txt; curl -sI "$B/images/$id1.webp" >> report.txt
          git init -q -b site-snapshot && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Website snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-snapshot
